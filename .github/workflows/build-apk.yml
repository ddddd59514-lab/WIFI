name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build variant to generate (debug or release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build ${{ inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses || true
          else
            echo "sdkmanager not found, writing standard Android SDK license hashes"
            mkdir -p "$SDK_DIR/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          fi
          ls -la "$SDK_DIR/licenses" || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore and environment file
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Prepare release keystore (release builds only)
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "Warning: RELEASE_KEYSTORE_BASE64 secret is not set. Ensure my-upload-key.jks or KEYSTORE_PATH is configured."
          fi

      - name: Build APK with Gradle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            TASK=":app:assembleRelease"
          else
            TASK=":app:assembleDebug"
          fi

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew "$TASK" --no-daemon --stacktrace
          else
            gradle "$TASK" --no-daemon --stacktrace
          fi

      - name: Verify APK output exists
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          ls -lh "app/build/outputs/apk/${BUILD_TYPE}/"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: root-wifi-${{ inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type || 'debug' }}/*.apk
          if-no-files-found: error
          retention-days: 30
